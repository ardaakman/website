<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Writing by Arda Akman." />
  <title>Blog — Arda Akman</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>A</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;500;600&display=swap" rel="stylesheet" />
  <script>
    const theme = localStorage.getItem('theme') || 'light';
    if (theme === 'dark') document.documentElement.classList.add('dark-mode');
  </script>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #5a5a5a;
      --border: #dddddd;
      --code-bg: #f4f4f4;
      --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
      --serif: 'Newsreader', Georgia, serif;
      --display: 'Cormorant Garamond', Georgia, serif;
    }
    html.dark-mode {
      --bg: #060606;
      --text: #f3f3f3;
      --muted: #9a9a9a;
      --border: #2a2a2a;
      --code-bg: #121212;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    a { color: inherit; text-decoration: none; transition: border-color 0.2s ease; }
    ::selection { background: var(--text); color: var(--bg); }

    .container {
      width: min(720px, calc(100% - 48px));
      margin: 0 auto;
      padding: 40px 0 64px;
      animation: fadeIn 0.45s ease-out both;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }
    .site-title {
      font-family: var(--display);
      font-size: 32px;
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; }
    .nav-link {
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
    }
    .nav-link:hover, .nav-link.active { color: var(--text); border-bottom-color: currentColor; }

    .theme-toggle {
      width: 34px; height: 34px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .theme-toggle:hover { border-color: var(--text); transform: translateY(-1px); }
    .theme-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; }
    html.dark-mode .sun-icon { display: block; }
    html.dark-mode .moon-icon { display: none; }
    html:not(.dark-mode) .sun-icon { display: none; }
    html:not(.dark-mode) .moon-icon { display: block; }

    main { padding-top: 44px; }
    h1 { font-family: var(--display); font-size: clamp(36px, 5vw, 46px); font-weight: 500; letter-spacing: -0.01em; line-height: 1.1; margin-bottom: 8px; }
    h2 { font-family: var(--display); font-size: 28px; font-weight: 500; margin: 36px 0 10px; }
    h3 { font-family: var(--display); font-size: 23px; font-weight: 500; margin: 28px 0 8px; }
    .lede { color: var(--muted); font-size: 15px; margin-bottom: 40px; }
    .post-date { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-bottom: 40px; }

    article p { color: var(--muted); margin-bottom: 20px; }
    article ul, article ol { color: var(--muted); padding-left: 24px; margin-bottom: 20px; }
    article li { margin: 6px 0; }
    article a { color: var(--text); border-bottom: 1px solid var(--border); }
    article a:hover { border-bottom-color: currentColor; }
    article strong { color: var(--text); font-weight: 600; }
    article img { max-width: 100%; border-radius: 6px; }
    blockquote { border-left: 2px solid var(--text); padding-left: 18px; color: var(--muted); margin-bottom: 20px; }
    code { font-family: var(--mono); font-size: 0.85em; background: var(--code-bg); padding: 2px 5px; border-radius: 4px; }
    pre { background: var(--code-bg); border-radius: 8px; padding: 16px; overflow-x: auto; margin-bottom: 20px; }
    pre code { background: none; padding: 0; font-size: 13.5px; line-height: 1.6; }
    hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }

    .crumbs { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-bottom: 32px; }
    .crumbs a { border-bottom: 1px solid transparent; padding-bottom: 1px; }
    .crumbs a:hover { color: var(--text); border-bottom-color: currentColor; }
    .fs-list { list-style: none; font-family: var(--mono); font-size: 15px; }
    .fs-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 12px 2px;
      border-bottom: 1px solid var(--border);
    }
    .fs-item a { display: inline-flex; align-items: baseline; gap: 10px; min-width: 0; }
    .fs-item a:hover .fs-name { color: var(--muted); }
    .fs-icon { color: var(--muted); font-size: 13px; flex-shrink: 0; }
    .fs-name { overflow-wrap: anywhere; }
    .fs-dir .fs-name::after { content: '/'; color: var(--muted); }
    .fs-meta { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
    .empty { color: var(--muted); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) { .container { animation: none; } * { transition: none !important; } }
    @media screen and (max-width: 600px) {
      .site-title { font-size: 26px; }
      h1 { font-size: 32px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="site-title">arda akman</a>
      <nav>
        <a class="nav-link active" href="/blog/">blog</a>
        <a class="nav-link" href="https://github.com/ardaakman" target="_blank" rel="noopener">github</a>
        <a class="nav-link" href="https://www.linkedin.com/in/arda-akman/" target="_blank" rel="noopener">linkedin</a>
        <a class="nav-link" href="https://x.com/arda_akmann" target="_blank" rel="noopener">twitter</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </header>
    <main>
      
      <h1>blog</h1>
      <p class="lede">Notes on backend systems, infra, and whatever I find interesting.</p>
      <p class="empty">No posts yet — coming soon.</p>
    </main>
  </div>
  <script>
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
